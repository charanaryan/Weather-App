name: GCP WIF Authentication Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload-to-gcp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1057284291890/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-wif-sa@iamsa-513606.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create test file
        run: |
          echo "WIF authentication successful!" > wif-test.txt
          echo "Repository: $GITHUB_REPOSITORY" >> wif-test.txt
          echo "Branch: $GITHUB_REF" >> wif-test.txt

      - name: Upload file to Cloud Storage
        run: |
          gcloud storage cp wif-test.txt gs://charanaryan-wif-demo-2026/
